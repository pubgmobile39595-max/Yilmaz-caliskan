<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Şifre Yenileme - Yılmaz Çalışkan Turizm</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: white;
    }

    .box {
      width: 100%;
      max-width: 420px;
      background: #151515;
      border: 1px solid #292929;
      border-radius: 18px;
      padding: 30px;
    }

    h1 {
      margin-top: 0;
      font-size: 25px;
    }

    p {
      color: #aaa;
      line-height: 1.5;
    }

    label {
      display: block;
      margin: 20px 0 8px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #0d0d0d;
      color: white;
      font-size: 16px;
      outline: none;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: white;
      color: black;
      font-size: 16px;
      font-weight: bold;
    }

    button:disabled {
      opacity: .6;
    }

    #message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 10px;
      display: none;
      line-height: 1.4;
    }

    .success {
      display: block !important;
      background: #12351e;
      color: #8cffaa;
    }

    .error {
      display: block !important;
      background: #3a1515;
      color: #ff9999;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #aaa;
      text-decoration: none;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>🔐 Yeni Şifre Belirle</h1>

  <p>
    Yılmaz Çalışkan Turizm yönetici hesabınız için yeni bir şifre oluşturun.
  </p>

  <form id="passwordForm">

    <label for="newPassword">
      Yeni şifre
    </label>

    <input
      id="newPassword"
      type="password"
      minlength="8"
      placeholder="En az 8 karakter"
      required
    >

    <label for="confirmPassword">
      Yeni şifre tekrar
    </label>

    <input
      id="confirmPassword"
      type="password"
      minlength="8"
      placeholder="Şifreyi tekrar yazın"
      required
    >

    <button id="saveButton" type="submit">
      Yeni Şifreyi Kaydet
    </button>

  </form>

  <div id="message"></div>

  <a class="back" href="admin.html">
    ← Yönetici girişine dön
  </a>

</div>


<script>

const SUPABASE_URL =
  "https://vbaglsnkmahnwdazqcue.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_jFv8ZP75Ais3eSjx_bsjzg_pAcgoJ0G";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


const form =
  document.getElementById("passwordForm");

const newPassword =
  document.getElementById("newPassword");

const confirmPassword =
  document.getElementById("confirmPassword");

const saveButton =
  document.getElementById("saveButton");

const message =
  document.getElementById("message");


function showMessage(text, type) {

  message.textContent = text;
  message.className = type;

}


/*
  SUPABASE RECOVERY LINK
  URL'deki access_token / refresh_token
  değerlerini yakalıyoruz.
*/

async function handleRecoverySession() {

  const hash =
    window.location.hash.substring(1);

  const params =
    new URLSearchParams(hash);

  const accessToken =
    params.get("access_token");

  const refreshToken =
    params.get("refresh_token");

  const type =
    params.get("type");


  /*
    Eğer recovery linki token içeriyorsa
    Supabase oturumu oluşturuyoruz.
  */

  if (accessToken && refreshToken) {

    const {
      data,
      error
    } = await supabaseClient.auth.setSession({

      access_token: accessToken,

      refresh_token: refreshToken

    });


    if (error) {

      console.error(error);

      showMessage(
        "Recovery oturumu oluşturulamadı: " +
        error.message,
        "error"
      );

      return false;

    }

    console.log(
      "Recovery session oluşturuldu."
    );

    return true;
  }


  /*
    Bazı Supabase bağlantılarında
    token URL'nin query kısmında olabilir.
  */

  const queryParams =
    new URLSearchParams(
      window.location.search
    );

  const queryAccessToken =
    queryParams.get("access_token");

  const queryRefreshToken =
    queryParams.get("refresh_token");


  if (
    queryAccessToken &&
    queryRefreshToken
  ) {

    const {
      error
    } = await supabaseClient.auth.setSession({

      access_token:
        queryAccessToken,

      refresh_token:
        queryRefreshToken

    });


    if (error) {

      showMessage(
        "Oturum oluşturulamadı: " +
        error.message,
        "error"
      );

      return false;

    }

    return true;

  }


  /*
    Zaten aktif bir Supabase session
    varsa onu kullan.
  */

  const {
    data
  } =
    await supabaseClient.auth.getSession();


  if (data.session) {

    return true;

  }


  showMessage(
    "Bu şifre yenileme bağlantısı geçerli değil veya süresi dolmuş. Yeni bir recovery bağlantısı oluşturmalısın.",
    "error"
  );

  return false;

}


form.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();


    const password =
      newPassword.value.trim();

    const confirmation =
      confirmPassword.value.trim();


    if (password.length < 8) {

      showMessage(
        "Şifre en az 8 karakter olmalıdır.",
        "error"
      );

      return;

    }


    if (password !== confirmation) {

      showMessage(
        "Şifreler aynı değil.",
        "error"
      );

      return;

    }


    saveButton.disabled = true;

    saveButton.textContent =
      "Kaydediliyor...";


    /*
      Önce session var mı kontrol ediyoruz.
    */

    const {
      data: sessionData
    } =
      await supabaseClient.auth.getSession();


    if (!sessionData.session) {

      showMessage(
        "Şifre yenileme oturumu bulunamadı. Recovery bağlantısını doğrudan e-postadan açmalısın.",
        "error"
      );

      saveButton.disabled = false;

      saveButton.textContent =
        "Yeni Şifreyi Kaydet";

      return;

    }


    /*
      Şifreyi Supabase Auth üzerinde
      değiştiriyoruz.
    */

    const {
      error
    } =
      await supabaseClient.auth.updateUser({

        password: password

      });


    if (error) {

      console.error(error);

      showMessage(
        "Şifre değiştirilemedi: " +
        error.message,
        "error"
      );

      saveButton.disabled = false;

      saveButton.textContent =
        "Yeni Şifreyi Kaydet";

      return;

    }


    showMessage(
      "✅ Şifre başarıyla değiştirildi!",
      "success"
    );


    form.style.display =
      "none";


    setTimeout(function() {

      window.location.href =
        "admin.html";

    }, 2000);

  }
);


/*
  Sayfa açılır açılmaz recovery
  oturumunu yakala.
*/

handleRecoverySession();

</script>

</body>
</html>
